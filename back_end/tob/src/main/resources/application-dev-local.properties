#port server
server.port = 8888

#mysql db
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:33306/badminton_db?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=04012003
#sequence sql
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sequences/sequence.sql
#hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#connect pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.auto-commit=true

#redis
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.database=0
spring.data.redis.password=04012003
spring.data.redis.connect-timeout=60000
#redis pool
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=5

#spring cache
spring.cache.type=redis
spring.cache.redis.time-to-live=30000

#redis customize
app.cache.redis.ttl-minutes=10
app.cache.redis.key-prefix-name=app

#timeout rest template
app.rest.connection-timeout = 30000
app.rest.read-timeout = 60000

#web params
app.web.encoding=UTF-8
app.web.class-path-message=classpath:messages

#pageable
app.pageable.max-page-size = 50
app.pageable.one-index-page = true

#logging
logging.config=classpath:config/logback-spring.xml
logging.file.path=C://Users//Admin//Downloads//logs
#logging cache
logging.level.org.springframework.cache=TRACE
logging.level.org.springframework.data.redis=DEBUG
